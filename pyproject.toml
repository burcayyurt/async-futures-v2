[project]
name = "async-futures-v2"
version = "0.1.0"
description = "Async Hyperliquid perpetual futures trading bot"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "eth-account>=0.11",
    "eth-utils>=2.0",
    "websockets>=12.0",
    "aiohttp>=3.9",
    "msgpack>=1.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
